<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18221E"/>
      <stop offset="100%" stop-color="#0B0F0E"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="35%" stop-color="#D6B47A"/>
      <stop offset="70%" stop-color="#C58A45"/>
      <stop offset="100%" stop-color="#8F5E24"/>
    </linearGradient>

    <!-- Emerald Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#087A68"/>
      <stop offset="100%" stop-color="#064F45"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Shield Base with Rounded Chamfered Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85"/>
  
  <!-- Inner Technical Shield Accent -->
  <polygon points="256,60 436,130 436,310 256,452 76,310 76,130" fill="none" stroke="url(#tealGrad)" stroke-width="6" opacity="0.45"/>

  <!-- Glowing Blasting Jet / Arc Ray Background Burst -->
  <path d="M256 120 L270 210 L360 220 L280 270 L300 360 L240 290 L170 340 L210 260 L140 220 L230 200 Z" fill="url(#goldGrad)" opacity="0.15" filter="url(#goldGlow)"/>

  <!-- Bold GK Monogram -->
  <!-- 'G' Letterform -->
  <path d="M228 174 C205 160 172 166 150 188 C124 214 124 266 150 292 C176 318 218 318 244 294 C256 282 262 266 262 248 L200 248 L200 214 L296 214 C298 256 284 294 256 322 C214 362 148 360 108 318 C68 276 68 206 110 162 C146 124 204 118 246 146 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- 'K' Letterform -->
  <path d="M304 144 L346 144 L346 226 L396 144 L446 144 L380 246 L452 352 L400 352 L346 266 L346 352 L304 352 Z" fill="#F3F1EA"/>

  <!-- High-Precision Industrial Diamond Spark Accent (Blast Nozzle Point) -->
  <polygon points="256,410 274,435 256,460 238,435" fill="url(#goldGrad)"/>
  <circle cx="256" cy="435" r="4" fill="#FFFFFF"/>

  <!-- Live Quality Indicator Dot -->
  <circle cx="415" cy="98" r="14" fill="#2DD4BF" filter="url(#goldGlow)"/>
  <circle cx="415" cy="98" r="6" fill="#FFFFFF"/>
</svg>
